# Local infrastructure for `pnpm dev` and the test suites.
# Every external dependency has a local substitute: no test requires a call to a
# third party (plans/18 §2). The prod equivalents are managed services (18 §3).
name: orrery

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: orrery
      POSTGRES_PASSWORD: orrery
      POSTGRES_DB: orrery
      # CITEXT is required by the schema (B4); the corrected Prisma schema cannot be
      # created without these extensions, which is why migration 0001 creates them.
      POSTGRES_INITDB_ARGS: '--auth-host=scram-sha-256'
    command:
      - postgres
      - -c
      - shared_preload_libraries=pg_stat_statements
    # The host port is parameterised, not hardcoded. Two reasons, and the second is the
    # real one: 5432 is allocated by default on many machines and on CI runners that also
    # run a system Postgres, and a hardcoded port turns "the database did not start" into a
    # confusing bind error rather than a clear message. The CONTAINER port is fixed at 5432
    # because that is what the server expects; only the host side moves.
    ports: ['${POSTGRES_HOST_PORT:-5432}:5432']
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U orrery -d orrery']
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    command: ['redis-server', '--appendonly', 'yes']
    ports: ['${REDIS_HOST_PORT:-6379}:6379']
    volumes: [redisdata:/data]
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 20

  # S3-compatible object storage. Sim bundles are content-addressed and immutable,
  # so this is also the long-lived CDN origin in prod (ADR-0014).
  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: orrery
      MINIO_ROOT_PASSWORD: orrery-secret
    ports: ['${MINIO_HOST_PORT:-9000}:9000', '${MINIO_CONSOLE_HOST_PORT:-9001}:9001']
    volumes: [miniodata:/data]
    healthcheck:
      test: ['CMD', 'mc', 'ready', 'local']
      interval: 5s
      timeout: 3s
      retries: 20

  # Catches the seeded bucket + bucket policy the app expects. Runs to completion.
  minio-init:
    image: minio/mc:latest
    depends_on:
      minio: { condition: service_healthy }
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 orrery orrery-secret;
      mc mb --ignore-existing local/orrery-assets;
      mc mb --ignore-existing local/orrery-sims;
      mc anonymous set download local/orrery-sims;
      echo 'buckets ready';"
    restart: 'no'

  # Email UI on :8025. R12: email deliverability is a real onboarding failure mode, so
  # invitation flows are exercised against a real MTA-shaped service, not a mock.
  mailpit:
    image: axllent/mailpit:latest
    ports: ['${SMTP_HOST_PORT:-1025}:1025', '${MAILPIT_HOST_PORT:-8025}:8025']
    environment:
      MP_MAX_MESSAGES: 5000
      MP_SMTP_AUTH_ACCEPT_ANY: 1
      MP_SMTP_AUTH_ALLOW_INSECURE: 1

  otel:
    image: otel/opentelemetry-collector-contrib:latest
    command: ['--config=/etc/otel/config.yaml']
    volumes: ['./infra/otel/config.yaml:/etc/otel/config.yaml:ro']
    ports: ['${OTLP_HOST_PORT:-4317}:4317', '${OTLP_HTTP_HOST_PORT:-4318}:4318']
    # The `attemptId` spine (18 §4.2) is only as good as this collector.

volumes:
  pgdata:
  redisdata:
  miniodata:
