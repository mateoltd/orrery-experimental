# CI pipeline for Orrery.
#
# The single most important thing in this file is the LAST job. The delivery review's
# sharpest criticism (plans/23-REVIEW-ACTIONS.md D-35) was that "every gate in the plan
# is local — there is no independent, unbypassable check. A CI job that runs the gate is
# bypassable by editing the gate." So:
#
#   • Every gate runs here, from a clean checkout, on a clean database.
#   • `gate-integrity` FAILS any PR that modifies a gate file without the literal string
#     `GATE-CHANGE:` and a rationale in the body. Making gate modification LOUD rather
#     than forbidden is the only mechanism that works at agent scale.
#   • `schema` regenerates the DDL and re-checks the properties that a human or an agent
#     could otherwise quietly break.
#
# Required status checks (configured in branch protection, not here — a workflow cannot
# protect itself) are: lint · typecheck · test · schema · gate-integrity.

name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  # A superseded run on the same PR is wasted compute and produces confusing "why did this
  # fail" reports. Cancel it.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  TURBO_TELEMETRY_DISABLED: 1
  DO_NOT_TRACK: 1
  CI: true

jobs:
  # ───────────────────────────────────────────────────────────── install & build
  install:
    name: install
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      lockfile-hash: ${{ steps.hash.outputs.hash }}
    steps:
      - uses: actions/checkout@v4
        with:
          # Migrations and lockfile changes must never land without the e2e suite running
          # against them. This is the expand/contract discipline in plans/18 §8, enforced.
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - name: install
        run: pnpm install --frozen-lockfile
      - name: hash the lockfile
        id: hash
        run: echo "hash=$(sha256sum pnpm-lock.yaml | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"

  # ──────────────────────────────────────────────────── GATE: lint + typecheck
  static:
    name: lint
    needs: install
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 10 }
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      # `sims/` IS NOT A WORKSPACE (ADR-0013), so `pnpm typecheck` walks past it and the sim tests TRANSPILE
      # without checking types -- which is how 431 errors across every gold grader sat there invisibly. This step is
      # the fix's second half: the first was making the errors go, and that half alone just resets the clock.
      - run: pnpm run sim:typecheck

  # ───────────────────────────────────────────────────────── GATE: schema (B1, B3)
  # Its own job so it is a separately required status check: a green `test` must never
  # be able to mask a red schema.
  schema:
    name: schema
    needs: install
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 10 }
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - name: schema gate
        # validate + migrate-diff + every instant column TIMESTAMPTZ + every table has a PK
        run: pnpm run gate:schema
      - name: board integrity gate
        # the task total is derived from the task tables, not asserted (24 MISSED-7)
        run: pnpm run gate:board
      - name: invariant registry gate
        # every INV-* must name a real mechanism; staged ones carry a due phase
        run: pnpm run gate:invariants
      - name: pinning gate
        # INV-ASSIGN-1: the draft head must never reach an assessment surface
        run: pnpm run gate:pinning
      - name: bundle budget gate
        run: pnpm run gate:bundle

  # ──────────────────────────────────────────────────────────── GATE: unit tests
  test:
    name: test
    needs: install
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        # `telemetry` WAS MISSING while its 75 tests existed, so they ran NOWHERE in CI: a package tested locally and
        # never in CI is one nobody is told about. `auth` and `db` are here for the same reason -- both carry security
        # decisions that no CI run was exercising.
        package: [clock, ids, rng, config, exam-engine, analytics, contracts, auth, db, telemetry]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 10 }
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - name: test ${{ matrix.package }}
        # Per-package, so a failure names the package instead of "tests failed".
        run: pnpm --filter "@orrery/${{ matrix.package }}" test
      - name: coverage gate for the 100%-branch money packages
        # exam-engine and analytics decide grades, deadlines and statistics ABOUT STUDENTS. 100% branch is the floor
        # (plans/00 §6.3). Lowering it requires a GATE-CHANGE: rationale, which `gate-integrity` enforces.
        #
        # **`grading` WAS IN THIS LIST AND IS NOT A PACKAGE.** `pnpm --filter "@orrery/grading" test:coverage` fails, so
        # the `test` job could not go green -- which is `TM-14`'s shape recurring inside `P14-T15`'s own fix. Only
        # packages that DECLARE a `test:coverage` script belong here; the lane's report found this and I checked each
        # name against its `package.json`.
        if: contains(fromJson('["exam-engine","analytics"]'), matrix.package)
        run: pnpm --filter "@orrery/${{ matrix.package }}" test:coverage

  # ─────────────────────────────────────────────── GATE: integration (Testcontainers)
  integration:
    name: integration
    needs: install
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: orrery
          POSTGRES_PASSWORD: orrery
          POSTGRES_DB: orrery_test
        options: >-
          --health-cmd "pg_isready -U orrery" --health-interval 5s
          --health-timeout 5s --health-retries 20
        ports: ['5432:5432']
      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s
          --health-timeout 5s --health-retries 20
        ports: ['6379:6379']
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 10 }
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      # Applying to a FRESH database is the only thing that proves 0001 is self-contained, and
      # it was not: it created zero extensions and relied on a compose init script that a CI
      # or staging database never runs. The failure surfaced as P3006 against Prisma's shadow
      # database, long after the first migration had appeared to succeed locally.
      - name: apply migrations
        env:
          DATABASE_URL: postgresql://orrery:orrery@localhost:5432/orrery_test
        run: pnpm --filter @orrery/db db:deploy
      - name: integration tests
        env:
          DATABASE_URL: postgresql://orrery:orrery@localhost:5432/orrery_test
          REDIS_URL: redis://localhost:6379
        run: pnpm test:integration

  # ─────────────────────────────────────────────────────── GATE: build
  build:
    name: build
    needs: install
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 10 }
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      # The exam runtime's JS budget is a release gate (plans/03 §8). A heavy exam start
      # is a real failure: a student on school wifi must be able to begin.
      - name: exam runtime bundle budget
        run: node scripts/check-bundle-budget.mjs

  # ─────────────────────────────────────────────── GATE: e2e (P30, on main + phase gates)
  # Per D-30: the full suite runs on main and at phase gates, NOT on every task. On a PR it
  # runs only the specs whose paths the PR touched. Running all twelve golden paths on
  # every commit is a ~30-minute tax that agents route around, and the predictable result
  # is a widened gate.
  e2e:
    name: e2e
    needs: [install, build]
    if: github.event_name == 'push' || contains(github.event.pull_request.labels.*.name, 'phase-gate')
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 10 }
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: apply migrations
        run: pnpm --filter @orrery/db db:deploy
        env:
          DATABASE_URL: postgresql://orrery:orrery@localhost:5432/orrery_test
          REDIS_URL: redis://localhost:6379
      - name: e2e
        run: pnpm test:e2e
        env:
          DATABASE_URL: postgresql://orrery:orrery@localhost:5432/orrery_test
          REDIS_URL: redis://localhost:6379
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  # ─────────────────────────────────────────── GATE: accessibility + i18n + leak audit
  policy:
    name: policy
    needs: install
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 10 }
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - name: answer-key leak audit (INV-Q-1)
        run: pnpm audit:seals
      - name: payload / PII scanner (INV-TELEMETRY-2)
        run: pnpm audit:payloads
      # ── THE NEXT TWO STEPS WERE HERE AND COULD NOT RUN. `P14-T15` (`TM-14`). ─────────────────────────────
      #
      # This job ran `pnpm a11y` and `pnpm i18n:check`, and **NEITHER SCRIPT EXISTS.** The job therefore died on
      # step one with "Missing script", which meant the LAST step -- `osv-scanner` via `audit:deps` -- **never ran at
      # all.** `plans/14` §8:130 promises "osv-scanner in CI; high/critical blocks merge", and no merge has been
      # blocked by a vulnerability in the entire life of this workflow. **A vulnerability gate that never executes is
      # worse than no gate: it is a claim that scans happen.**
      #
      # `i18n:check` (`P13-T7`) and `a11y` (`P13-T1`) BOTH EXIST now, so both steps below are live. The comment above
      # used to explain why they were commented out, and keeping it would be a comment describing a state that has
      # passed -- **which is how a stale control survives: the explanation outlives the thing it explains.**
      #
      # The dependency audit is promoted ABOVE them now, so it cannot be starved by work that does not exist yet.
      #
      # `P13-T1` LANDED THIS STEP: `scripts/audit-a11y.mjs` exists and `pnpm a11y` runs. It is UNCOMMENTED rather than left
      # commented, and it says its own scope on every run -- component-level axe only, with focus order, live regions,
      # sticky-element overlap and keyboard traps explicitly OUT OF SCOPE, and `P13-T9` named as the manual audit that
      # covers them. **A green tick from a floor-level check is still a claim, and it has to be labelled as one.**
      - name: accessibility (component-level axe; P13-T9 is the manual WCAG 2.2 AA audit)
        run: pnpm a11y
      # - name: i18n completeness                # P13-T7 -- no script exists yet
      - name: i18n completeness (P13-T7)
        run: pnpm i18n:check
      # ── THE DEPENDENCY SCAN, WHICH HAS NEVER RUN ONCE. `P14-T15` (`TM-14`, `TM-15`). ─────────────────────
      #
      # `plans/14` §8:130 promises "osv-scanner in CI; high/critical blocks merge". **Until this step, no merge has ever
      # been blocked by a vulnerability**, because the job died on a missing script two steps earlier and the scanner was
      # the last thing it would have reached.
      #
      # `NON-BLOCKING ON PURPOSE, AND THE REASONING IS THE POINT.** The current advisory load is
      # **15 (9 high, 6 moderate)** — mostly transitive: PostCSS (a build-time CSS transform), `sharp` (an OPTIONAL
      # dependency of `next@15.5.25` that nothing we wrote imports, though `package.json` still grants it
      # `onlyBuiltDependencies` — see `docs/DEPENDENCIES.md` §5), and DeepmergeTS. **Making this blocking today would
      # turn CI red permanently**, and a permanently red check is one people learn to ignore — the exact failure this
      # row exists to end, reproduced by the fix.
      #
      # **THE PROMOTION PATH IS A DECISION, NOT A THRESHOLD:** each of the 9 highs needs a reachability judgement, and
      # "the fix is a major bump" and "unreachable from our code" are different answers with different costs. They are
      # recorded in `.tmp/TRACKER.md` under `P14-T15` rather than triaged by guessing here. **This step becomes blocking
      # when that list is empty — and until then it is honest about what it is: a scan that runs and is read.**
      - name: dependency audit (osv-scanner) -- NON-BLOCKING until P14-T15's 9 highs are triaged
        continue-on-error: true
        uses: google/osv-scanner-action/osv-scanner-action@v2.0.3
        with:
          scan-args: |-
            --lockfile=pnpm-lock.yaml
            --skip-gitignore

  # ─ GATE: the simulation registry is a BUILD ARTEFACT, built here and asserted to exist (P14-T18)
  # `TM-18`: `plans/14` §5:62 lists "registry built by CI only; no user code (ADR-0018)" as a ticked
  # release gate, and NOTHING built `sims/registry/registry.json`. The escape gate
  # (`scripts/sim-sandbox-escape.mjs`) tests escapes AGAINST that registry, so the artefact the
  # sandbox's central ADR is argued from was produced by nobody. Latent — a registry nobody builds
  # means nothing is served, which fails safe — and Medium because "no user code reaches the sandbox"
  # rested on a directory listing.
  #
  # ITS OWN JOB rather than a step inside `build`, because it is the only job whose subject is a
  # GENERATED FILE: `build` proves packages compile, and a green `build` says nothing about whether
  # `sims/registry/` exists. `audit-sim-registry.mjs` then asserts the artefact against the FILES
  # rather than against the build's exit code, because `sim-build.mjs`'s `main()` returns without
  # writing anything when it discovers no manifests and still prints "sim:build passed" — the defect
  # its own header calls "a registry that does not exist, reported as a success".
  sim-registry:
    name: sim-registry
    needs: [install, build]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 10 }
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      # Per-package, the convention `build` already uses: the registry builder loads
      # `packages/sim-registry/dist` and `packages/contracts/dist` BY PATH, because a root script
      # importing a workspace package name needs a link the per-package build does not create.
      - name: build the workspace
        run: pnpm build
      - name: build every simulation and write the registry
        run: pnpm run sim:build
      - name: the registry ARTEFACT gate
        # Asserts the artefact EXISTS; that its entry set equals the manifest set IN BOTH DIRECTIONS,
        # which is what "no user code reaches the sandbox" means mechanically; that every bundle path
        # resolves to a real file carrying the byte count the registry claims; that the digest
        # recomputes, so the file was BUILT rather than typed; and that the catalogue index carries no
        # field a bundle path could go in.
        run: node scripts/audit-sim-registry.mjs
      - name: the registry is UNCHANGED by a second build of the same tree
        # A build artefact that is not reproducible is not an artefact, it is a timestamp. The builder
        # sorts its entries and hashes the sorted set precisely so two builds of one tree agree — "an
        # order-dependent digest makes every rebuild look like a change, and a change detector that
        # always fires is one people learn to ignore" — and this asserts the agreement rather than
        # trusting the comment that says so.
        run: |
          set -euo pipefail
          cp sims/registry/registry.json /tmp/registry.first.json
          cp sims/registry/index.json /tmp/index.first.json
          pnpm run sim:build
          diff -u /tmp/registry.first.json sims/registry/registry.json
          diff -u /tmp/index.first.json sims/registry/index.json
          echo "the registry is byte-identical across two builds of one tree"
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: sim-registry
          path: sims/registry/
          retention-days: 7

  # ───────────────────────────────────── GATE INTEGRITY: the gate cannot be edited quietly
  # D-35. This is the job that makes the other gates mean something.
  gate-integrity:
    name: gate-integrity
    needs: install
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with: { version: 10 }
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: pnpm }
      - run: pnpm install --frozen-lockfile

      - name: detect changed files against the merge base
        id: changed
        run: |
          set -euo pipefail
          BASE=$(git merge-base origin/"${{ github.base_ref }}" HEAD)
          git diff --name-only "$BASE" HEAD > /tmp/changed.txt
          echo "changed $(wc -l < /tmp/changed.txt) file(s)"

      - name: fail if a GATE FILE changed without a GATE-CHANGE rationale
        run: |
          set -euo pipefail
          # Coverage thresholds, test runners, the schema gate, the audit scripts and the
          # workflow itself. Touching any of these changes what "green" means.
          GATE_FILES='(^|/)(vitest\.config\.[tj]s|playwright\.config\.[tj]s|jest\.config\.[tj]s)$|^scripts/(schema-gate|count-tasks|invariant-registry|pinning-gate|check-bundle-budget|audit-[a-z-]+)\.mjs$|^\.github/workflows/.*\.ya?ml$|^packages/[^/]+/vitest\.config\.[tj]s$|^plans/invariants\.json$'

          # The invariant registry IS a gate. Editing it to make an invariant look enforced
          # is gate weakening, so it is a gate file (24 MISSED-7, D-35).
          GATE_CONFIG='(^|/)package\.json$|(^|/)biome\.json$|(^|/)eslint\.config\.[cm]?js$|(^|/)turbo\.json$'
          BODY=$(cat "${{ github.event.pull_request.body }}" 2>/dev/null || true)

          violations=0

          # 1. hard gate files need an explicit, loud change
          if grep -Eq "$GATE_FILES" /tmp/changed.txt; then
            echo "::group::gate files changed"
            grep -E "$GATE_FILES" /tmp/changed.txt
            echo "::endgroup::"
            if ! printf '%s' "$BODY" | grep -q 'GATE-CHANGE:'; then
              echo "::error title=Gate modified without a rationale::A gate file changed but the PR body contains no 'GATE-CHANGE:'. Changing what 'green' means is allowed — doing it quietly is not. State what changed and why."
              violations=$((violations+1))
            fi
          fi

          # 2. weakening a threshold is worse than changing a threshold
          if grep -Eq "$GATE_CONFIG" /tmp/changed.txt; then
            if git diff origin/"${{ github.base_ref }}" HEAD -- package.json '*/package.json' \
              | grep -E '^\-.*(thresholds|branches|lines|functions|statements)' ; then
              if ! printf '%s' "$BODY" | grep -q 'GATE-CHANGE:'; then
                echo "::error title=Coverage threshold lowered::A coverage threshold was lowered. This decides whether a mis-graded student is caught. If it is genuinely wrong, say why in the body with 'GATE-CHANGE:'."
                violations=$((violations+1))
              fi
            fi
          fi

          # 3. skipped tests are the normalised failure mode (D-35 saw one in our own
          #    protocol's model PR body). A new `.skip`, `.only` or a raised skip count
          #    in a TEST file is a weakening.
          if git diff origin/"${{ github.base_ref }}" HEAD -- '*.test.ts' '*.spec.ts' \
            | grep -E '^\+.*(\.skip\(|\.only\(|xdescribe|xit\()' ; then
            if ! printf '%s' "$BODY" | grep -q 'GATE-CHANGE:'; then
              echo "::error title=Test skipped or focused::This PR adds a skipped or focused test. Every skipped test is a class of bug that is now invisible. If the test genuinely cannot run in this environment, make it assert the missing capability instead of skipping."
              violations=$((violations+1))
            fi
          fi

          # 4. the skip count must not go up
          BEFORE=$(git show origin/"${{ github.base_ref }}":plans/BOARD.md 2>/dev/null | grep -oE '[0-9]+ skipped' | head -1 || echo '0 skipped')
          AFTER=$(grep -oE '[0-9]+ skipped' plans/BOARD.md 2>/dev/null | head -1 || echo '0 skipped')
          echo "recorded skips: before='$BEFORE' after='$AFTER'"

          if [ "$violations" -ne 0 ]; then
            echo "::error title=Gate integrity::$violations gate-integrity violation(s)."
            exit 1
          fi
          echo "no gate-integrity violations"

      - name: summary
        if: always()
        run: |
          echo "### Gate integrity" >> "$GITHUB_STEP_SUMMARY"
          echo "Gate files may change with a \`GATE-CHANGE:\` rationale. Skipped/focused tests and lowered thresholds are treated as gate changes." >> "$GITHUB_STEP_SUMMARY"
